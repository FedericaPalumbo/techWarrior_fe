<nav class="barra" aria-label="Navigazione principale">
    <!-- da loggato il logo porta al feed, altrimenti al login -->
    <a class="logo" [routerLink]="currentUser() ? '/feed' : '/login'" aria-label="MyC">
        <!-- TODO: sostituire il testo con il logo (il PDF va convertito in SVG/PNG): <img src="logo-myc.svg" alt="MyC"> -->
        <span class="logo-placeholder">MyC</span>
    </a>

    <!-- su telefono l'hamburger apre il menu; da tablet/desktop il menu è sempre visibile in linea
         e l'hamburger sparisce (css) -->
    <button type="button" class="hamburger" aria-label="Menu" aria-controls="menu-principale"
        [attr.aria-expanded]="menuAperto()" (click)="toggleMenu()">
        <span></span><span></span><span></span>
    </button>

    <!-- sempre nel DOM: la classe "aperto" lo mostra su telefono -->
    <div class="menu" id="menu-principale" [class.aperto]="menuAperto()">
        <span class="citta">{{ citta }}</span>

        <ul (click)="chiudiMenu()">
            <li><a routerLink="/mappa" routerLinkActive="active">Mappa</a></li>
            <li><a routerLink="/feed" routerLinkActive="active">Feed</a></li>
            <li><a routerLink="/segnalazione" routerLinkActive="active">Segnalazione</a></li>
            <li><a routerLink="/inviti" routerLinkActive="active">Inviti</a></li>
        </ul>

        <!-- nome utente ed "Esci" solo se loggato -->
        <app-nav-user *ifAuthenticated [user]="currentUser()!" (logout)="logout()" />
    </div>
</nav>
