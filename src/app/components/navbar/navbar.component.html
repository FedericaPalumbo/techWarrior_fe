<nav class="barra" aria-label="Navigazione principale">
    <!-- da loggato il logo porta al feed, altrimenti al login -->
    <a class="logo" [routerLink]="currentUser() ? '/feed' : '/login'" aria-label="MyC">
        <!-- TODO: sostituire il testo con il logo (il PDF va convertito in SVG/PNG): <img src="logo-myc.svg" alt="MyC"> -->
        <span class="logo-placeholder">MyC</span>
    </a>

    <!-- da loggato: hamburger che apre il menu con link, città e utente -->
    <ng-container *ifAuthenticated="true; else notLogged">
        <button type="button" class="hamburger" aria-label="Menu" [attr.aria-expanded]="menuAperto()"
            (click)="toggleMenu()">
            <span></span><span></span><span></span>
        </button>

        @if (menuAperto()) {
        <div class="menu">
            <span class="citta">{{ citta }}</span>

            <ul (click)="chiudiMenu()">
                <li><a routerLink="/feed" routerLinkActive="active">Feed</a></li>
                <li><a routerLink="/mappa" routerLinkActive="active">Mappa</a></li>
                <li><a routerLink="/inviti" routerLinkActive="active">Inviti volontari</a></li>
                <!-- solo il cittadino può inviare segnalazioni (al back un ente riceverebbe 403) -->
                <li *ifRole="'cittadino'"><a routerLink="/segnalazione" routerLinkActive="active">Nuova segnalazione</a>
                </li>
            </ul>

            <app-nav-user [user]="currentUser()!" (logout)="logout()" />
        </div>
        }
    </ng-container>

    <ng-template #notLogged>
        @if (showAuthBtns()) {
        <div class="auth">
            <a routerLink="/login">Accedi</a>
            <a routerLink="/register">Registrati</a>
        </div>
        }
    </ng-template>
</nav>
