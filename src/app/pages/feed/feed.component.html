<section class="feed">
    @if (errorMessage()) {
    <div class="errore" role="alert">
        <p>{{ errorMessage() }}</p>
        <button type="button" (click)="ricarica()">Riprova</button>
    </div>
    }

    @let segnalazioni = segnalazioni$ | async;
    @if (segnalazioni) {
    @for (segnalazione of segnalazioni; track segnalazione.id) {
    <app-segnalazione-card [segnalazione]="segnalazione" (onMappa)="vaiAllaMappa(segnalazione.id)"
        (onVota)="vota(segnalazione.id, $event)" (onSuggerimento)="inviaSuggerimento(segnalazione.id, $event)" />
    } @empty {
    @if (!errorMessage()) {
    <p class="stato">Nessuna segnalazione per ora.</p>
    }
    }
    } @else {
    <p class="stato">Caricamento...</p>
    }

    <!-- resta fisso in basso mentre si scorre -->
    <a class="btn-segnala" routerLink="/segnalazioni">Fai una segnalazione</a>
</section>
